spring.application.name=consultorio-odontologico-api

spring.config.import=optional:file:./application-bootstrap.properties

spring.datasource.url=jdbc:mysql://localhost:3306/consultorio_odontologico
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
api.security.jwt.secret=${JWT_SECRET}
api.security.jwt.access-token-expiration=900000
